# name: One Dark Pro Darker
# palette based on Binaryify/OneDark-Pro oneDarkProDarker

$base           = 0xff181a1f
$surface        = 0xff1e2227
$overlay        = 0xff23272e
$muted          = 0xff495162
$subtle         = 0xff7f848e
$text           = 0xffabb2bf
$bright         = 0xffd7dae0

$love           = 0xffe05561
$gold           = 0xffd19a66
$rose           = 0xffd18f52
$pine           = 0xff8cc265
$foam           = 0xff56b6c2
$iris           = 0xffc678dd
$blue           = 0xff61afef

$highlightLow   = 0xff1e2227
$highlightMed   = 0xff2c313a
$highlightHigh  = 0xff323842

$active_border  = rgba(d19a66ee) rgba(d19a66ee) rgba(c678ddee) rgba(c678ddee) rgba(c678ddee) rgba(61afefee) rgba(61afefee) rgba(61afefee) 90deg

general {
    col.active_border = $active_border
    col.inactive_border = rgb(1e2227)
    gaps_in = 4
    gaps_out = 8
    border_size = 1
}

group {
    col.border_active = $active_border
    col.border_inactive = rgb(23272e)

    groupbar {
        text_color = rgb(abb2bf)
        text_color_inactive = rgb(495162)
        col.active = rgba(abb2bf40)
        col.inactive = rgba(49516230)
    }
}

decoration {
    rounding = 0
    rounding_power = 4

    blur {
        enabled = true
        size = 12
        passes = 1
        new_optimizations = true
        xray = true
        popups = false
    }

    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0
}

windowrule {
    name = windowrule-1
    border_color = $love
    match:fullscreen = 1
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.1
}

layerrule {
    name = animate-walker
    match:namespace = walker
    no_anim = false
    blur = true
    ignore_alpha = 0.1
}

animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1
    bezier = default, 0.05, 0.9, 0.1, 1.05
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 2.5, md3_accel
    animation = windowsMove, 1, 3, md3_decel, slide
    animation = border, 1, 10, md3_decel
    animation = borderangle, 1, 30, linear, loop
    animation = fade, 1, 2.5, md3_decel
    animation = fadeIn, 1, 2, md3_decel
    animation = fadeOut, 1, 1.5, md3_accel
    animation = layersIn, 1, 2, md3_decel, popin 80%
    animation = layersOut, 1, 1.5, md3_accel
    animation = fadeLayersIn, 1, 1.5, md3_decel
    animation = fadeLayersOut, 1, 1.2, md3_accel
    animation = workspaces, 1, 3.5, easeOutExpo, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}
